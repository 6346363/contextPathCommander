name: Add to Project
on:
  issues:
    types: [opened]
jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - name: Add to project
        id: add
        uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/users/6346363/projects/1
          github-token: ${{ secrets.GH_PAT }}
      - name: Set status to Backlog
        if: steps.add.outputs.itemId != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            const itemId = '${{ steps.add.outputs.itemId }}';
            const result = await github.graphql(`
              query {
                user(login: "6346363") {
                  projectV2(number: 1) {
                    id
                    fields(first: 20) {
                      nodes {
                        ... on ProjectV2SingleSelectField {
                          id name
                          options { id name }
                        }
                      }
                    }
                  }
                }
              }
            `);
            const project = result.user.projectV2;
            const statusField = project.fields.nodes.find(f => f.name === 'Status');
            const backlog = statusField.options.find(o => o.name === 'Backlog');
            await github.graphql(`
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId
                  itemId: $itemId
                  fieldId: $fieldId
                  value: { singleSelectOptionId: $optionId }
                }) { projectV2Item { id } }
              }
            `, {
              projectId: project.id,
              itemId: itemId,
              fieldId: statusField.id,
              optionId: backlog.id
            });
